services:
  mysql-service:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3600:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  one-model:
    image: anamariaopris12/devops-shop:6.0
    ports:
      - 8300:8080
    environment:
       ConnectionStrings__DefaultConnection: "server=mysql-service;port=3306;database=online_shop_db;user=root;password=root"
       Jwt__Secret: "Y2hhbmdlLW1lLWluLXByb2QtdGhpcy1pcy1hLWxvbmctc2VjcmV0LWZvci1qd3QtaHMyNTY="
       Seed__Enabled: true
    depends_on:
      mysql-service:
        condition: service_healthy


volumes:
  mysql_data:

