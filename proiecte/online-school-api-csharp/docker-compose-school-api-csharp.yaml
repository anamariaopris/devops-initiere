services:
  mysql-service:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3330:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  one-model:
    image: anamariaopris12/devops-school-api:5.0
    ports:
      - 8200:8080
    environment:
       ConnectionStrings__DefaultConnection: "server=mysql-service;port=3306;database=online_school_db;user=root;password=root"
       Jwt__Secret: "b25saW5lLXNjaG9vbC1jbG91ZC1hcGktc3VwZXItc2VjdXJlLWp3dC1zZWNyZXQtbXVzdC1iZS1sb25nLWVub3VnaA=="
       Seed__Enabled: true
    depends_on:
      mysql-service:
        condition: service_healthy


volumes:
  mysql_data:

