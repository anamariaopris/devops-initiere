services:
  mysql-service:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3500:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  one-model:
    image: anamariaopris12/devops-one-model:4.0
    ports:
      - 8100:8080
    environment:
       ConnectionStrings__DefaultConnection: "server=mysql-service;port=3306;database=one-model_db;user=root;password=root"
    depends_on:
      mysql-service:
        condition: service_healthy


volumes:
  mysql_data:
