services:
  mysql-service:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3310:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  cars-users:
    image: anamariaopris12/devops-cars-user:1.0 
    ports:
      - 8000:8080
    environment:
          ConnectionStrings__DefaultConnection: "Server= mysql-service;port=3306;database=one_to_many_db;user=root;password=root"
    depends_on:
      mysql-service:
        condition: service_healthy

    



volumes:
  mysql_data:
